name: Env vars and ternary logic playground

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  FOO: 'Lorem ipsum.'
  BAR: '${{ vars.FOO }}'

jobs:
  playground:
    name: Playground
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Print vars
        run: |
          echo "FOO=${{ vars.FOO }}"
          echo "BAR=${{ vars.BAR }}"
